package:
  name: fiona
  version: "1.10.1"

requirements:
  host:
    - flet-libgdal 3.13.1
# {% if sdk == 'android' %}
    # fiona/_transform.so extension's DT_NEEDED names libc++_shared.so.
    - flet-libcpp-shared >=27.2.12479018
# {% endif %}

build:
  # 12 moves iOS onto the shared libgdal/libproj pair. One image means one
  # driver registry, so ios-driver-registry.patch is gone; a preload shim
  # replaces it, because the extensions link the dylibs through @rpath and
  # nothing on their rpath resolves those once flet has relocated them.
  number: 12
  script_env:
    GDAL_VERSION: 3.13.1
    # fiona reads GDAL_LIB_PATH (a colon-separated list); pyogrio's is spelled
    # GDAL_LIBRARY_PATH and takes one directory. Easy to copy the wrong one.
    GDAL_LIB_PATH: '{platlib}/opt/lib'
    GDAL_INCLUDE_PATH: '{platlib}/opt/include'
# {% if sdk == 'android' %}
    GDAL_LIBS: gdal
# {% else %}
    # libgdal is a real shared library on iOS now, and it resolves its own
    # dependency tree (proj, tiff, jpeg, curl, ssl, crypto, psl) internally, so
    # naming that chain here would be linking it a second time -- once per
    # extension, which is what this used to do.
    GDAL_LIBS: gdal
    # NOT `-undefined dynamic_lookup`: that suppressed the link errors this
    # chain used to produce, and with a real dylib an unresolved symbol is a
    # genuine defect that must fail here rather than at dlopen on a device.
    # The headerpad is required: serious_python rewrites each extension's
    # dependency from `@rpath/libgdal.dylib` to the much longer
    # `@rpath/opt.lib.libgdal.framework/opt.lib.libgdal`, and setuptools links
    # with no padding, so install_name_tool fails, the relocation pass aborts,
    # and `flet build` still exits 0 having shipped an app with no
    # site-packages.
    LDFLAGS: '-Wl,-headerpad_max_install_names'
# {% endif %}

# pyproj is not a fiona dependency -- it is here so the tests can exercise the
# one route PROJ's database has on Android. flet-libproj's opt/share/proj never
# reaches Android site-packages, so the database travels inside pyproj instead,
# and fiona's preload shim finds it there through find_spec. Without pyproj
# installed the test asserts the other half: EPSG codes raise.
test:
  requires:
    - pyproj

# Extracting PYPROJ, not fiona: on Android the PROJ database only exists inside
# pyproj's package, and a file inside Flet 0.86's sitepackages.zip is not a path
# PROJ can open. This is app-level in a real project too -- extract_packages is
# read from the app's pyproject, never inherited from a dependency's metadata --
# so an app wanting EPSG codes on Android has to declare it. Said plainly in the
# README's Coordinate systems section.
extract_packages:
  - pyproj

patches:
  - mobile.patch
  - ios-libgdal-preload.patch
