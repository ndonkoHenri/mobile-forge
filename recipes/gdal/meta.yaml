package:
  name: gdal
  # Pinned to match `flet-libgdal` (the host C library). GDAL's Python
  # bindings hard-require an exact major.minor match with libgdal —
  # any bump here must come with flet-libgdal bumped to the same
  # version, plus fiona / rasterio / pyogrio re-pinned in lockstep.
  version: "3.13.1"

requirements:
  host:
    - flet-libgdal 3.13.1
# {% if sdk == 'android' %}
    # libgdal links C++; the SWIG-generated _gdal.so loads via dlopen which
    # needs libc++_shared.so on Android.
    - flet-libcpp-shared >=27.2.12479018
# {% endif %}

build:
  # 2 moves iOS onto the SHARED libgdal from flet-libgdal build 3. This package
  # never needed a driver-registry patch -- its SWIG _gdal registers and looks
  # up in one image -- but it links the dylib like every other consumer, so it
  # needs the same preload shim and the same headerpad.
  number: 2
  script_env:
    GDAL_VERSION: 3.13.1
    GDAL_PREFIX: '{platlib}/opt'
    GDAL_CFLAGS: ''
# {% if sdk != 'android' %}
    # libgdal is a real shared library on iOS now and resolves its own
    # dependency tree internally, so setup.py's own `libraries = ['gdal']`
    # would do -- but config.patch's GDAL_LIBS hook is what setup.py reads, so
    # name it here rather than leaving the variable unset.
    GDAL_LIBS: gdal
    # NOT `-undefined dynamic_lookup`: with a real dylib an unresolved symbol is
    # a defect that must fail at link, not at dlopen on a device. The headerpad
    # is required because serious_python rewrites the extension's dependency
    # from `@rpath/libgdal.dylib` to the much longer framework path, and
    # setuptools links with no padding. Cheap insurance: the failure is silent
    # (`flet build` still exits 0) and ships an app with no site-packages.
    LDFLAGS: '-Wl,-headerpad_max_install_names'
# {% endif %}

patches:
  - config.patch
  - ios-libgdal-preload.patch
