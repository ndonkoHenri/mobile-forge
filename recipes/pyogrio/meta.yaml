package:
  name: pyogrio
  version: "0.12.1"

requirements:
  host:
    - flet-libgdal 3.13.1

build:
  # 3 moves iOS onto the SHARED libgdal that flet-libgdal ships from its build 3.
  # One image means one driver registry, so ios-driver-registry.patch is gone;
  # what replaces it is a preload shim, because the extensions link the dylib
  # through @rpath and nothing on their rpath resolves it once flet has
  # relocated them into frameworks.
  number: 3
  script_env:
    GDAL_VERSION: 3.13.1
    # pyogrio reads GDAL_LIBRARY_PATH (one directory). fiona and rasterio read
    # GDAL_LIB_PATH (a colon-separated list) — one word apart, easy to copy wrong.
    GDAL_LIBRARY_PATH: '{platlib}/opt/lib'
    GDAL_INCLUDE_PATH: '{platlib}/opt/include'
# {% if sdk != 'android' %}
    # libgdal is a real shared library on iOS now, and it resolves its own
    # dependency tree (proj, tiff, jpeg, curl, ssl, crypto, psl) internally, so
    # naming that chain here would be linking it a second time -- once per
    # extension, which is what this used to do.
    GDAL_LIBS: gdal
    # NOT `-undefined dynamic_lookup`: that suppressed the link errors this
    # chain used to produce, and with a real dylib an unresolved symbol is a
    # genuine defect that must fail here rather than at dlopen on a device.
    # The headerpad is required: serious_python rewrites each extension's
    # dependency from `@rpath/libgdal.dylib` to the much longer
    # `@rpath/opt.lib.libgdal.framework/opt.lib.libgdal`, and without room in
    # the Mach-O header install_name_tool fails, the relocation pass aborts, and
    # `flet build` still exits 0 having shipped an app with no site-packages.
    LDFLAGS: '-Wl,-headerpad_max_install_names'
# {% endif %}

patches:
  - mobile.patch
  - ios-libgdal-preload.patch
