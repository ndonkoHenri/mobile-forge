package:
  name: pyogrio
  version: "0.12.1"

requirements:
  host:
    - flet-libgdal 3.13.1

build:
  # iOS links the shared libgdal/libproj pair: one GDAL and one PROJ for every
  # consumer in the app. The preload shim loads both RTLD_GLOBAL before the first
  # extension import; whether flet's framework relocation resolves them without it
  # is untested.
  number: 2
  script_env:
    GDAL_VERSION: 3.13.1
    # pyogrio reads GDAL_LIBRARY_PATH (one directory). fiona and rasterio read
    # GDAL_LIB_PATH (a colon-separated list) — one word apart, easy to copy wrong.
    GDAL_LIBRARY_PATH: '{platlib}/opt/lib'
    GDAL_INCLUDE_PATH: '{platlib}/opt/include'
# {% if sdk != 'android' %}
    # NOT `-undefined dynamic_lookup`: with a real dylib an unresolved symbol is
    # a defect that must fail at link, not at dlopen on a device. The headerpad
    # is required: serious_python rewrites each extension's dependency from
    # `@rpath/libgdal.dylib` to the much longer framework path, and without room
    # in the Mach-O header install_name_tool fails, the relocation pass aborts,
    # and `flet build` still exits 0 having shipped an app with no site-packages.
    LDFLAGS: '-Wl,-headerpad_max_install_names'
# {% endif %}

# Not a pyogrio dependency: on Android PROJ's database reaches the device only
# inside pyproj, and the EPSG test decides its branch from whether it did.
test:
  requires:
    - pyproj

# App-level, never inherited from a dependency. PROJ opens proj.db by path, which
# a file inside sitepackages.zip does not have.
extract_packages:
  - pyproj

patches:
  - ios-libgdal-preload.patch
