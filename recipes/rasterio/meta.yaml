package:
  name: rasterio
  version: "1.5.0"

requirements:
  host:
    - flet-libgdal 3.13.1
    - numpy ^2.0.0
# {% if sdk == 'android' %}
    # rasterio's `_warp.so` / `_filepath.so` / `_fill.so` carry
    # `DT_NEEDED libc++_shared.so` directly.
    - flet-libcpp-shared >=27.2.12479018
# {% endif %}

build:
  # Same source version as pypi.flet.dev's rasterio-1.5.0-10 wheel, but
  # this rebuild links against flet-libgdal 3.13.1 (vs. the published
  # wheel's 3.10.0). pip's wheel selection picks the higher build_tag
  # per PEP 427 when name+version collide; the new wheel must outrank
  # build 10 or downstream installs would silently keep the old
  # libgdal-3.10-linked rasterio and the gdal chain bump would be invisible.
  # 12 adds ios-driver-registry.patch: with a static libgdal each extension
  # gets its own driver registry, so rasterio.open failed on iOS with
  # "No such driver registered: GTiff" while the driver listing succeeded.
  # 13 extends that patch to rasterio.shutil, the third module that resolves
  # driver names itself. It fails quietly rather than loudly: shutil.exists()
  # opens a dataset to identify it, and an empty registry makes that return
  # False for a file that is there.
  # 14 moves iOS onto the SHARED libgdal from flet-libgdal build 3. One image
  # means one driver registry, so ios-driver-registry.patch is gone -- including
  # the rasterio.shutil hunk build 13 added. A preload shim replaces it, because
  # the extensions link the dylib through @rpath and nothing on their rpath
  # resolves it after flet relocates them.
  number: 14
  script_env:
    GDAL_VERSION: 3.13.1
    # rasterio reads GDAL_LIB_PATH (a colon-separated list); pyogrio's is spelled
    # GDAL_LIBRARY_PATH and takes one directory. Easy to copy the wrong one.
    GDAL_LIB_PATH: '{platlib}/opt/lib'
    GDAL_INCLUDE_PATH: '{platlib}/opt/include'
# {% if sdk == 'android' %}
    GDAL_LIBS: gdal
# {% else %}
    # libgdal is a real shared library on iOS now, and it resolves its own
    # dependency tree (proj, tiff, jpeg, curl, ssl, crypto, psl) internally, so
    # naming that chain here would be linking it a second time -- once per
    # extension, which is what this used to do.
    GDAL_LIBS: gdal
    # NOT `-undefined dynamic_lookup`: that suppressed the link errors this
    # chain used to produce, and with a real dylib an unresolved symbol is a
    # genuine defect that must fail here rather than at dlopen on a device.
    # The headerpad is required: serious_python rewrites each extension's
    # dependency from `@rpath/libgdal.dylib` to the much longer
    # `@rpath/opt.lib.libgdal.framework/opt.lib.libgdal`, and setuptools links
    # with no padding, so install_name_tool fails, the relocation pass aborts,
    # and `flet build` still exits 0 having shipped an app with no
    # site-packages. No recipe on this branch sets it yet -- the precedent is
    # the `av` recipe on the unmerged `pyav` branch, whose 49 extensions each
    # carry seven such refs. pyarrow gets away without it on slack alone.
    LDFLAGS: '-Wl,-headerpad_max_install_names'
# {% endif %}

patches:
  - mobile.patch
  - ios-libgdal-preload.patch
