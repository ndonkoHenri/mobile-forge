package:
  name: pyproj
  version: "3.7.2"

build:
  # iOS links the shared libproj: one PROJ for pyproj and every GDAL consumer in
  # the app. A static one would give each of pyproj's eight PROJ-using
  # extensions its own proj.db search path, so set_data_dir() would configure
  # one of eight. The preload shim loads libproj RTLD_GLOBAL before the first
  # extension import; whether flet's framework relocation resolves it without
  # the shim is unverified.
  number: 2
  script_env:
    PROJ_VERSION: 9.5.0
    PROJ_DIR: '{platlib}/opt'
# {% if sdk == 'android' %}
    # Android only. iOS reads proj.db straight out of flet-libproj's
    # opt/share/proj, which is a real directory inside the app; on Android that
    # tree never reaches site-packages, so the database has to travel inside
    # this package instead. PROJ_WHEEL is upstream's own switch for bundling it,
    # and stage-proj-db.patch is what gives it something to bundle.
    PROJ_WHEEL: '1'
# {% endif %}
# {% if sdk != 'android' %}
    # NOT `-undefined dynamic_lookup`: with a real dylib an unresolved symbol is
    # a defect that must fail at link, not at dlopen on a device. The headerpad
    # is required: serious_python rewrites each extension's dependency from
    # `@rpath/libproj.dylib` to the much longer framework path, and without room
    # in the Mach-O header install_name_tool fails, the relocation pass aborts,
    # and `flet build` still exits 0 having shipped an app with no site-packages.
    LDFLAGS: '-Wl,-headerpad_max_install_names'
# {% endif %}

requirements:
  host:
    - flet-libproj 9.5.0

patches:
  - mobile.patch
  - ios-libproj-preload.patch
  - stage-proj-db.patch

# Android only, and only meaningful with PROJ_WHEEL above: pyproj reads the
# database through a real __file__ path, which inside Flet 0.86's
# sitepackages.zip is not a path at all.
extract_packages:
  - pyproj
