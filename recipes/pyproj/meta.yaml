package:
  name: pyproj
  version: "3.7.2"

build:
  # 2 moves iOS onto the SHARED libproj that flet-libproj ships from its build
  # 11. Eight of pyproj's extensions used to absorb their own PROJ, each with
  # its own proj.db search path, so set_data_dir() configured one of eight; they
  # now link one image, and libgdal links the same one.
  number: 2
  script_env:
    PROJ_VERSION: 9.5.0
    PROJ_DIR: '{platlib}/opt'
# {% if sdk == 'android' %}
    # Android only. iOS reads proj.db straight out of flet-libproj's
    # opt/share/proj, which is a real directory inside the app; on Android that
    # tree never reaches site-packages, so the database has to travel inside
    # this package instead. PROJ_WHEEL is upstream's own switch for bundling it,
    # and stage-proj-db.patch is what gives it something to bundle.
    PROJ_WHEEL: '1'
# {% endif %}
# {% if sdk != 'android' %}
    # libproj is a real shared library on iOS now, and it resolves its own
    # dependency tree (tiff, jpeg, curl, ssl, crypto, psl) internally, so naming
    # that chain here would link it a second time -- once per extension, which
    # is what this used to do.
    PROJ_LIBS: proj
    # NOT `-undefined dynamic_lookup`: that suppressed the link errors this
    # chain used to produce, and with a real dylib an unresolved symbol is a
    # genuine defect that must fail here rather than at dlopen on a device.
    # The headerpad is required: serious_python rewrites each extension's
    # dependency from `@rpath/libproj.dylib` to the much longer
    # `@rpath/opt.lib.libproj.framework/opt.lib.libproj`, and setuptools links
    # with no padding, so install_name_tool fails, the relocation pass aborts,
    # and `flet build` still exits 0 having shipped an app with no
    # site-packages.
    LDFLAGS: '-Wl,-headerpad_max_install_names'
# {% endif %}

requirements:
  host:
    - flet-libproj 9.5.0

patches:
  - mobile.patch
  - ios-libproj-preload.patch
  - stage-proj-db.patch

# Android only, and only meaningful with PROJ_WHEEL above: pyproj reads the
# database through a real __file__ path, which inside Flet 0.86's
# sitepackages.zip is not a path at all.
extract_packages:
  - pyproj
