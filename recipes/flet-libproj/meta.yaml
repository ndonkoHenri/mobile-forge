{% set version = "9.5.0" %}

package:
  name: flet-libproj
  version: '{{ version }}'

source:
  url: https://download.osgeo.org/proj/proj-{{ version }}.tar.gz

build:
  # 11 builds iOS SHARED (see build.sh). A static libproj is copied into every
  # extension that links it, so pyproj carried eight separate PROJ instances --
  # each with its own proj.db search path, so `set_data_dir()` configured one of
  # eight. Shared also lets libgdal and pyproj share a single PROJ.
  number: 11
# {% if sdk != 'android' %}
  script_env:
    LDFLAGS: '-undefined dynamic_lookup'
# {% endif %}

requirements:
  build:
    - cmake
  host:
    - flet-libtiff 4.7.0
    - flet-libcurl 8.11.0
# {% if sdk in ['iphoneos', 'iphonesimulator'] %}
    # Only needed to LINK the shared library: libcurl is built --with-openssl,
    # and a real dylib has to resolve its own dependency tree rather than
    # deferring it to each consumer's extension link.
    - openssl >=3.0.15
    - flet-libjpeg 3.0.90
# {% endif %}

about:
  # The iOS build is SHARED, and a shared library CONTAINS what it links: this
  # dylib absorbs libtiff, libjpeg-turbo, libcurl, libpsl and OpenSSL, none of
  # which PROJ's own COPYING covers. Same reasoning as flet-libjq bundling
  # oniguruma's notice and flet-libpsl bundling the Chromium DAFSA one.
  #
  # The obligation did not appear with the shared build -- under the static one
  # the same object code was pulled into each CONSUMER's extension instead, so
  # it shipped inside pyproj's wheel, which as a Python-package recipe has no
  # mechanism to add licence files. Moving it here is what makes it declarable.
  #
  # Android links these as real shared libraries, so nothing is absorbed there
  # and only MIT would apply; the wheel carries one licence set for both rather
  # than diverging, which over-states Android's obligations and never
  # under-states iOS's. MPL-2.0 is the one with teeth -- libpsl compiles in the
  # Public Suffix List data.
  license_file:
    - COPYING
    - licenses/LICENSE.libtiff.md
    - licenses/LICENSE.libjpeg-turbo.md
    - licenses/COPYING.curl
    - licenses/COPYING.libpsl
    - licenses/LICENSE.chromium
    - licenses/LICENSE.openssl
  license: MIT AND libtiff AND BSD-4.3TAHOE AND IJG AND BSD-3-Clause AND Zlib AND curl AND MPL-2.0 AND Apache-2.0
